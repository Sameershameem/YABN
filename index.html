<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Yasir Ali Business Network (YABN): practical entrepreneurship training, hands-on business growth support and a trusted founder network."
    />
    <meta property="og:title" content="YABN | Yasir Ali Business Network" />
    <meta property="og:description" content="Building the next generation of entrepreneurs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" /></noscript>
    <!-- the navy frame behind the hero card is the first image people see, so fetch it early -->
    <link rel="preload" as="image" href="/img/wave-800.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/wave-1600.webp" media="(min-width: 768px)" fetchpriority="high" />
    <title>YABN | Yasir Ali Business Network</title>
    <!-- Loader styles are inline so the loader paints on the very first frame, before any JS -->
    <style>
      #loader {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #ffffff; color: #021329;
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0s linear 0.6s;
      }
      #loader .ld-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      #loader svg { width: 52px; height: 52px; overflow: visible; }
      /* three growth bars rise in turn, then the gold arrow draws over them */
      #loader .ld-bar { fill: #021329; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: ld-grow 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #loader .ld-bar:nth-of-type(2) { animation-delay: 0.12s; }
      #loader .ld-bar:nth-of-type(3) { animation-delay: 0.24s; }
      #loader .ld-arrow { fill: none; stroke: #B98F32; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: ld-draw 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.45s forwards; }
      #loader .ld-word { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.42em; padding-left: 0.42em; opacity: 0; animation: ld-fade 0.6s ease 0.7s forwards; }
      #loader.is-done { opacity: 0; visibility: hidden; }
      #loader.is-done .ld-inner { transform: scale(1.08); }
      @keyframes ld-grow { to { transform: scaleY(1); } }
      @keyframes ld-draw { to { stroke-dashoffset: 0; } }
      @keyframes ld-fade { to { opacity: 1; } }
      /* hold the page's own entrance animations until the curtain lifts */
      html.is-loading [class*="animate-"] { animation-play-state: paused; }
      html.is-loading body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #loader, #loader * { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body>
    <script>document.documentElement.classList.add('is-loading')</script>
    <div id="loader" role="status" aria-label="Loading YABN">
      <div class="ld-inner" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect class="ld-bar" x="7" y="30" width="8" height="12" rx="1.5" />
          <rect class="ld-bar" x="20" y="22" width="8" height="20" rx="1.5" />
          <rect class="ld-bar" x="33" y="14" width="8" height="28" rx="1.5" />
          <path class="ld-arrow" pathLength="1" d="M4 30 C 16 26, 27 17, 42 5 M33 5 H42 V14" />
        </svg>
        <p class="ld-word">YABN</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
