<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161412" />
    <meta
      name="description"
      content="Yasir Ali Business Network (YABN): practical entrepreneurship training, hands-on business growth support and a trusted founder network."
    />
    <meta property="og:title" content="YABN | Yasir Ali Business Network" />
    <meta property="og:description" content="Building the next generation of entrepreneurs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&family=Playfair+Display:ital,wght@1,500;1,600;1,700&display=swap" /></noscript>
    <!-- the phone-sized hero photo is the first thing people see, so fetch it early -->
    <link rel="preload" as="image" href="/img/hero-800.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/hero-1600.webp" media="(min-width: 768px)" fetchpriority="high" />
    <title>YABN | Yasir Ali Business Network</title>
    <!-- Loader styles are inline so the loader paints on the very first frame, before any JS -->
    <style>
      #loader {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #161412; color: #efe5d6;
        font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
        transition: transform 0.95s cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      #loader .ld-inner { display: flex; flex-direction: column; align-items: center; transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.76, 0, 0.24, 1); }
      #loader .ld-mark { display: flex; gap: 0.32em; padding-left: 0.32em; font-size: clamp(30px, 6vw, 44px); font-weight: 400; overflow: hidden; }
      #loader .ld-mark span { display: inline-block; transform: translateY(110%); animation: ld-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #loader .ld-mark span:nth-child(2) { animation-delay: 0.08s; }
      #loader .ld-mark span:nth-child(3) { animation-delay: 0.16s; }
      #loader .ld-mark span:nth-child(4) { animation-delay: 0.24s; }
      #loader .ld-sub { margin: 10px 0 0; padding-left: 0.5em; font-size: 9px; letter-spacing: 0.5em; color: rgb(239 229 214 / 0.55); opacity: 0; animation: ld-fade 0.8s ease 0.45s forwards; }
      #loader .ld-line { position: relative; width: 120px; height: 1px; margin-top: 28px; background: rgb(239 229 214 / 0.14); overflow: hidden; }
      #loader .ld-line i { position: absolute; inset: 0; background: linear-gradient(90deg, #8a6a45, #d8bc8e); transform: scaleX(0); transform-origin: left; animation: ld-fill 1.3s cubic-bezier(0.65, 0, 0.35, 1) 0.3s forwards; }
      #loader.is-done { transform: translate3d(0, -100%, 0); }
      #loader.is-done .ld-inner { opacity: 0; transform: translate3d(0, -40px, 0); }
      @keyframes ld-up { to { transform: none; } }
      @keyframes ld-fade { to { opacity: 1; } }
      @keyframes ld-fill { to { transform: scaleX(1); } }
      /* hold the page's own entrance animations until the curtain lifts */
      html.is-loading .animate-rise, html.is-loading .animate-settle, html.is-loading .animate-fade { animation-play-state: paused; }
      html.is-loading body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #loader, #loader * { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body>
    <script>document.documentElement.classList.add('is-loading')</script>
    <div id="loader" role="status" aria-label="Loading YABN">
      <div class="ld-inner" aria-hidden="true">
        <div class="ld-mark"><span>Y</span><span>A</span><span>B</span><span>N</span></div>
        <p class="ld-sub">BUSINESS NETWORK</p>
        <div class="ld-line"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
